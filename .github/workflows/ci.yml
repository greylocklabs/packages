name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  commitlint:
    uses: greylocklabs/.github/.github/workflows/commitlint.yml@v1

  markdownlint:
    uses: greylocklabs/.github/.github/workflows/markdownlint.yml@v1

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck scripts/*.sh tests/*.sh

  apt:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install tools
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            ca-certificates gnupg rpm createrepo-c apt-utils >/dev/null
      - uses: actions/checkout@v5
      - run: tests/repo_test.sh build /srv/repo
      - uses: actions/upload-artifact@v4
        with:
          name: test-repo
          path: /srv/repo

  dnf:
    needs: apt
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: test-repo
          path: /srv/repo
      - run: tests/repo_test.sh dnf /srv/repo
